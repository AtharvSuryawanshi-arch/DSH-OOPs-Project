spring:
  application:
    name: itsm

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-this-secret-must-be-at-least-32-bytes-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  sla:
    monitor-interval-ms: ${SLA_MONITOR_INTERVAL_MS:30000}
    escalation-interval-minutes: ${SLA_ESCALATION_INTERVAL_MINUTES:15}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
    com.example.itsm: ${APP_LOG_LEVEL:info}
